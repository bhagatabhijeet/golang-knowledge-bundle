<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="t d">
  <title id="t">go run vs go build</title>
  <desc id="d">go run compiles into a temporary directory in the build cache, runs the program, and throws the binary away. go build compiles a binary you keep and can copy anywhere. go install compiles into GOBIN, which is on your PATH, so you can type the command name anywhere.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="800" height="420" rx="20" fill="#0F172A"/>
  <text x="40" y="46" fill="#E2E8F0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700">go run vs go build</text>
  <text x="40" y="70" fill="#94A3B8" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">Same compiler. The difference is what happens to the binary.</text>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- Lane 1: go run -->
    <rect x="24" y="90" width="752" height="96" rx="12" fill="#1E293B"/>
    <rect x="40" y="104" width="110" height="34" rx="17" fill="#00ADD8"/>
    <text x="95" y="127" text-anchor="middle" fill="#0F172A" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700">go run</text>
    <rect x="170" y="112" width="110" height="52" rx="8" fill="#0F172A" stroke="#5DC9E2"/>
    <text x="225" y="136" text-anchor="middle" fill="#E2E8F0" font-size="14">source</text>
    <text x="225" y="154" text-anchor="middle" fill="#94A3B8" font-family="Consolas, Menlo, monospace" font-size="11">main.go</text>
    <rect x="310" y="104" width="210" height="68" rx="8" fill="#0F172A" stroke="#5DC9E2" stroke-dasharray="4 4"/>
    <text x="415" y="126" text-anchor="middle" fill="#E2E8F0" font-size="14">compile to a temp dir</text>
    <text x="415" y="144" text-anchor="middle" fill="#94A3B8" font-family="Consolas, Menlo, monospace" font-size="10.5">%LocalAppData%\go-build</text>
    <text x="415" y="160" text-anchor="middle" fill="#94A3B8" font-family="Consolas, Menlo, monospace" font-size="10.5">~/.cache/go-build</text>
    <rect x="550" y="112" width="80" height="52" rx="8" fill="#0F172A" stroke="#00A29C"/>
    <text x="590" y="143" text-anchor="middle" fill="#00A29C" font-size="14" font-weight="600">runs</text>
    <rect x="660" y="112" width="100" height="52" rx="8" fill="#0F172A" stroke="#CE3262" stroke-dasharray="3 3"/>
    <text x="710" y="134" text-anchor="middle" fill="#CE3262" font-size="13" font-weight="600">binary</text>
    <text x="710" y="152" text-anchor="middle" fill="#CE3262" font-size="13">thrown away</text>

    <!-- Lane 2: go build -->
    <rect x="24" y="200" width="752" height="96" rx="12" fill="#1E293B"/>
    <rect x="40" y="214" width="110" height="34" rx="17" fill="#CE3262"/>
    <text x="95" y="237" text-anchor="middle" fill="#E2E8F0" font-family="Consolas, Menlo, monospace" font-size="15" font-weight="700">go build</text>
    <rect x="170" y="222" width="110" height="52" rx="8" fill="#0F172A" stroke="#5DC9E2"/>
    <text x="225" y="246" text-anchor="middle" fill="#E2E8F0" font-size="14">source</text>
    <text x="225" y="264" text-anchor="middle" fill="#94A3B8" font-family="Consolas, Menlo, monospace" font-size="11">./ch01/cli-lab</text>
    <rect x="310" y="222" width="210" height="52" rx="8" fill="#0F172A" stroke="#5DC9E2"/>
    <text x="415" y="253" text-anchor="middle" fill="#E2E8F0" font-size="14">compile + link</text>
    <rect x="550" y="214" width="210" height="68" rx="8" fill="#0F172A" stroke="#FDDD00" stroke-width="2"/>
    <text x="655" y="236" text-anchor="middle" fill="#FDDD00" font-size="14" font-weight="600">a binary you keep</text>
    <text x="655" y="254" text-anchor="middle" fill="#E2E8F0" font-family="Consolas, Menlo, monospace" font-size="12">bin/cli-lab · cli-lab.exe</text>
    <text x="655" y="272" text-anchor="middle" fill="#94A3B8" font-size="12">copy anywhere, run anytime</text>

    <!-- Lane 3: go install -->
    <rect x="24" y="310" width="752" height="96" rx="12" fill="#1E293B"/>
    <rect x="40" y="324" width="110" height="34" rx="17" fill="#E2E8F0"/>
    <text x="95" y="347" text-anchor="middle" fill="#0F172A" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="700">go install</text>
    <rect x="170" y="332" width="110" height="52" rx="8" fill="#0F172A" stroke="#5DC9E2"/>
    <text x="225" y="363" text-anchor="middle" fill="#E2E8F0" font-size="14">compile</text>
    <rect x="310" y="324" width="210" height="68" rx="8" fill="#0F172A" stroke="#00ADD8"/>
    <text x="415" y="346" text-anchor="middle" fill="#00ADD8" font-family="Consolas, Menlo, monospace" font-size="14" font-weight="700">$GOBIN</text>
    <text x="415" y="364" text-anchor="middle" fill="#94A3B8" font-size="12">default $GOPATH/bin</text>
    <text x="415" y="381" text-anchor="middle" fill="#94A3B8" font-family="Consolas, Menlo, monospace" font-size="11">e.g. ~/go/bin</text>
    <rect x="550" y="324" width="210" height="68" rx="8" fill="#0F172A" stroke="#00A29C" stroke-width="2"/>
    <text x="655" y="346" text-anchor="middle" fill="#00A29C" font-size="14" font-weight="600">on your PATH</text>
    <text x="655" y="366" text-anchor="middle" fill="#E2E8F0" font-size="12">type <tspan font-family="Consolas, Menlo, monospace" fill="#FDDD00">cli-lab</tspan> anywhere</text>
  </g>

  <g stroke="#94A3B8" stroke-width="2" marker-end="url(#a)">
    <path d="M150 121 L164 132"/>
    <path d="M280 138 L304 138"/>
    <path d="M520 138 L544 138"/>
    <path d="M630 138 L654 138"/>
    <path d="M150 231 L164 242"/>
    <path d="M280 248 L304 248"/>
    <path d="M520 248 L544 248"/>
    <path d="M150 341 L164 352"/>
    <path d="M280 358 L304 358"/>
    <path d="M520 358 L544 358"/>
  </g>
</svg>
