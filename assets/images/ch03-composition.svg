<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-label="Inheritance tree compared with Go composition by embedding, where methods are promoted">
  <rect width="800" height="380" rx="18" fill="#0F172A"/>
  <text x="400" y="42" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#E2E8F0">Is-a trees vs has-a building blocks</text>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- left: inheritance -->
    <rect x="25" y="70" width="350" height="285" rx="14" fill="#1E293B"/>
    <text x="200" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#94A3B8">Classic inheritance (not Go)</text>
    <rect x="140" y="120" width="120" height="40" rx="8" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <text x="200" y="146" text-anchor="middle" font-size="15" fill="#E2E8F0">Animal</text>
    <rect x="60" y="200" width="120" height="40" rx="8" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <text x="120" y="226" text-anchor="middle" font-size="15" fill="#E2E8F0">Dog</text>
    <rect x="220" y="200" width="120" height="40" rx="8" fill="none" stroke="#94A3B8" stroke-width="2"/>
    <text x="280" y="226" text-anchor="middle" font-size="15" fill="#E2E8F0">RobotDog ?</text>
    <path d="M120 200 L190 160 M280 200 L210 160" stroke="#94A3B8" stroke-width="2"/>
    <text x="200" y="285" text-anchor="middle" font-size="14" fill="#CE3262">Deep trees are rigid.</text>
    <text x="200" y="308" text-anchor="middle" font-size="14" fill="#CE3262">Where does a robot dog go?</text>

    <!-- right: composition -->
    <rect x="425" y="70" width="350" height="285" rx="14" fill="#1E293B"/>
    <text x="600" y="100" text-anchor="middle" font-size="16" font-weight="700" fill="#00ADD8">Go: embedding</text>
    <rect x="455" y="120" width="290" height="150" rx="12" fill="none" stroke="#00ADD8" stroke-width="2.5"/>
    <text x="475" y="146" font-family="Consolas, Menlo, monospace" font-size="15" fill="#E2E8F0">type Counter struct {</text>
    <rect x="480" y="160" width="115" height="40" rx="8" fill="#0F172A" stroke="#00A29C" stroke-width="2"/>
    <text x="537" y="186" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#00A29C">sync.Mutex</text>
    <rect x="610" y="160" width="115" height="40" rx="8" fill="#0F172A" stroke="#FDDD00" stroke-width="2"/>
    <text x="667" y="186" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#FDDD00">Logger</text>
    <text x="480" y="228" font-family="Consolas, Menlo, monospace" font-size="14" fill="#94A3B8">hits map[string]int</text>
    <text x="475" y="256" font-family="Consolas, Menlo, monospace" font-size="15" fill="#E2E8F0">}</text>
    <text x="600" y="300" text-anchor="middle" font-size="14" fill="#E2E8F0">Promoted: c.Lock()  c.Unlock()  c.Log()</text>
    <text x="600" y="325" text-anchor="middle" font-size="14" fill="#00A29C">Mix parts freely. No hierarchy.</text>
  </g>
</svg>
