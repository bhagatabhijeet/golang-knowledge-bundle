<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d">
  <title id="t">What an import gives you</title>
  <desc id="d">import "fmt" opens package fmt: exported, capitalized names like Println and Sprintf are usable; lowercase internals stay hidden. Import paths resolve to the standard library, your module, or the module cache.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#FDDD00"/></marker>
  </defs>
  <rect width="800" height="400" rx="20" fill="#0F172A"/>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="400" y="38" text-anchor="middle" fill="#E2E8F0" font-size="22" font-weight="700">import "fmt": a door into another package</text>
    <text x="400" y="62" text-anchor="middle" fill="#94A3B8" font-size="14">You get its exported (Capitalized) names. The rest stays behind the wall.</text>

    <!-- your file -->
    <rect x="30" y="90" width="230" height="170" rx="14" fill="#1E293B" stroke="#00ADD8" stroke-width="2"/>
    <text x="48" y="116" fill="#00ADD8" font-size="15" font-weight="700">your main.go</text>
    <g font-family="Consolas, Menlo, monospace" font-size="13">
      <text x="48" y="146" fill="#E2E8F0">package main</text>
      <text x="48" y="174" fill="#CE3262">import <tspan fill="#FDDD00">"fmt"</tspan></text>
      <text x="48" y="204" fill="#E2E8F0">fmt.<tspan fill="#00A29C">Println</tspan>("hi")</text>
      <text x="48" y="230" fill="#94A3B8">fmt.newPrinter() ✗</text>
    </g>

    <line x1="262" y1="172" x2="318" y2="172" stroke="#FDDD00" stroke-width="2.5" marker-end="url(#a)"/>

    <!-- package fmt -->
    <rect x="322" y="90" width="448" height="170" rx="14" fill="#1E293B" stroke="#00A29C" stroke-width="2"/>
    <text x="340" y="116" fill="#00A29C" font-size="15" font-weight="700">package fmt</text>
    <rect x="340" y="128" width="236" height="116" rx="10" fill="#0F172A" stroke="#00A29C"/>
    <text x="356" y="150" fill="#00A29C" font-size="13" font-weight="700">✓ exported: usable</text>
    <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#E2E8F0">
      <text x="356" y="174">Println  Printf</text>
      <text x="356" y="196">Sprintf  Errorf</text>
      <text x="356" y="218">Stringer Scanln</text>
    </g>
    <rect x="590" y="128" width="164" height="116" rx="10" fill="#0F172A" stroke="#CE3262" stroke-dasharray="5 5"/>
    <text x="604" y="150" fill="#CE3262" font-size="13" font-weight="700">✗ unexported</text>
    <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#94A3B8">
      <text x="604" y="174">newPrinter</text>
      <text x="604" y="196">pp  buffer</text>
      <text x="604" y="218">doPrintln</text>
    </g>

    <!-- resolution -->
    <text x="30" y="296" fill="#E2E8F0" font-size="15" font-weight="700">Where Go finds the code</text>
    <g font-size="13">
      <rect x="30" y="310" width="236" height="66" rx="10" fill="#1E293B" stroke="#5DC9E2"/>
      <text x="44" y="334" fill="#5DC9E2" font-family="Consolas, Menlo, monospace">"fmt"  "net/http"</text>
      <text x="44" y="358" fill="#94A3B8">standard library: ships with Go</text>
      <rect x="282" y="310" width="236" height="66" rx="10" fill="#1E293B" stroke="#FDDD00"/>
      <text x="296" y="334" fill="#FDDD00" font-family="Consolas, Menlo, monospace">"gokb/ch01/…/shapes"</text>
      <text x="296" y="358" fill="#94A3B8">your module: go.mod path + folder</text>
      <rect x="534" y="310" width="236" height="66" rx="10" fill="#1E293B" stroke="#CE3262"/>
      <text x="548" y="334" fill="#CE3262" font-family="Consolas, Menlo, monospace">"github.com/google/uuid"</text>
      <text x="548" y="358" fill="#94A3B8">third party: go get → module cache</text>
    </g>
  </g>
</svg>
