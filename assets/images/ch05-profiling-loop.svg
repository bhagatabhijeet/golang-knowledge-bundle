<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" role="img" aria-label="The performance loop: benchmark, profile with pprof, form a hypothesis, change one thing, compare with benchstat, and repeat">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#FDDD00"/>
    </marker>
  </defs>
  <rect width="800" height="470" rx="18" fill="#0F172A"/>
  <text x="400" y="42" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#E2E8F0">The performance loop</text>
  <text x="400" y="66" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8">measure, never guess, then measure again</text>

  <!-- centre -->
  <circle cx="400" cy="262" r="70" fill="#1E293B" stroke="#00ADD8" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="400" y="256" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FDDD00">numbers,</text>
  <text x="400" y="280" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#FDDD00">not vibes</text>

  <!-- connecting arrows (clockwise) -->
  <g stroke="#FDDD00" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <path d="M505 128 Q 590 135 640 168"/>
    <path d="M680 228 Q 690 280 660 318"/>
    <path d="M530 352 L 280 352"/>
    <path d="M140 318 Q 110 280 120 228"/>
    <path d="M160 168 Q 210 135 295 128"/>
  </g>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="300" y="96" width="200" height="60" rx="12" fill="#1E293B" stroke="#00ADD8" stroke-width="2"/>
    <text x="400" y="121" text-anchor="middle" font-size="15" font-weight="700" fill="#00ADD8">1 · Benchmark</text>
    <text x="400" y="143" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#E2E8F0">go test -bench=. -count=10</text>

    <rect x="560" y="170" width="214" height="56" rx="12" fill="#1E293B" stroke="#5DC9E2" stroke-width="2"/>
    <text x="667" y="194" text-anchor="middle" font-size="15" font-weight="700" fill="#5DC9E2">2 · Profile</text>
    <text x="667" y="215" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#E2E8F0">-cpuprofile → go tool pprof</text>

    <rect x="534" y="322" width="214" height="60" rx="12" fill="#1E293B" stroke="#00A29C" stroke-width="2"/>
    <text x="641" y="347" text-anchor="middle" font-size="15" font-weight="700" fill="#00A29C">3 · Hypothesize</text>
    <text x="641" y="368" text-anchor="middle" font-size="12" fill="#E2E8F0">"the + loop copies too much"</text>

    <rect x="52" y="322" width="224" height="60" rx="12" fill="#1E293B" stroke="#CE3262" stroke-width="2"/>
    <text x="164" y="347" text-anchor="middle" font-size="15" font-weight="700" fill="#CE3262">4 · Change one thing</text>
    <text x="164" y="368" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#E2E8F0">use strings.Builder</text>

    <rect x="26" y="170" width="214" height="56" rx="12" fill="#1E293B" stroke="#FDDD00" stroke-width="2"/>
    <text x="133" y="194" text-anchor="middle" font-size="15" font-weight="700" fill="#FDDD00">5 · Compare</text>
    <text x="133" y="215" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" fill="#E2E8F0">benchstat old.txt new.txt</text>
  </g>

  <text x="400" y="420" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8">Real result from this chapter's code (your numbers will differ):</text>
  <text x="400" y="444" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#E2E8F0">JoinSlow ~1 ms/op · 1998 allocs   →   JoinFast ~10 µs/op · 15 allocs</text>
</svg>
