<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="t d">
  <title id="t">Workspace, module, package, file</title>
  <desc id="d">Nested boxes: a workspace (go.work) holds modules (go.mod); a module holds packages (directories); a package holds .go files.</desc>
  <rect width="800" height="440" rx="20" fill="#0F172A"/>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="400" y="38" text-anchor="middle" fill="#E2E8F0" font-size="22" font-weight="700">Package ≠ module ≠ workspace</text>
    <text x="400" y="62" text-anchor="middle" fill="#94A3B8" font-size="14">Four nested levels. Each one has its own marker.</text>

    <!-- Workspace -->
    <rect x="24" y="80" width="752" height="336" rx="16" fill="none" stroke="#FDDD00" stroke-width="2" stroke-dasharray="8 6"/>
    <text x="44" y="108" fill="#FDDD00" font-size="16" font-weight="700">WORKSPACE</text>
    <text x="150" y="108" fill="#94A3B8" font-size="13" font-family="Consolas, Menlo, monospace">go.work · optional · local dev only</text>

    <!-- Module A -->
    <rect x="44" y="124" width="430" height="272" rx="14" fill="#1E293B" stroke="#00ADD8" stroke-width="2"/>
    <text x="62" y="152" fill="#00ADD8" font-size="16" font-weight="700">MODULE</text>
    <text x="140" y="152" fill="#94A3B8" font-size="13" font-family="Consolas, Menlo, monospace">go.mod · "the project" · versioned unit</text>
    <text x="62" y="174" fill="#E2E8F0" font-size="13" font-family="Consolas, Menlo, monospace">module example.com/app</text>

    <!-- package main -->
    <rect x="62" y="190" width="190" height="186" rx="12" fill="#0F172A" stroke="#CE3262" stroke-width="2"/>
    <text x="78" y="216" fill="#CE3262" font-size="15" font-weight="700">PACKAGE main</text>
    <text x="78" y="236" fill="#94A3B8" font-size="12">one directory · ./cmd/app/</text>
    <rect x="78" y="250" width="158" height="30" rx="6" fill="#1E293B"/>
    <text x="90" y="270" fill="#E2E8F0" font-size="13" font-family="Consolas, Menlo, monospace">main.go</text>
    <rect x="78" y="288" width="158" height="30" rx="6" fill="#1E293B"/>
    <text x="90" y="308" fill="#E2E8F0" font-size="13" font-family="Consolas, Menlo, monospace">flags.go</text>
    <text x="78" y="350" fill="#FDDD00" font-size="12">🚀 executable: runnable file</text>

    <!-- package store -->
    <rect x="268" y="190" width="190" height="186" rx="12" fill="#0F172A" stroke="#00A29C" stroke-width="2"/>
    <text x="284" y="216" fill="#00A29C" font-size="15" font-weight="700">PACKAGE store</text>
    <text x="284" y="236" fill="#94A3B8" font-size="12">one directory · ./store/</text>
    <rect x="284" y="250" width="158" height="30" rx="6" fill="#1E293B"/>
    <text x="296" y="270" fill="#E2E8F0" font-size="13" font-family="Consolas, Menlo, monospace">store.go</text>
    <rect x="284" y="288" width="158" height="30" rx="6" fill="#1E293B"/>
    <text x="296" y="308" fill="#E2E8F0" font-size="13" font-family="Consolas, Menlo, monospace">store_test.go</text>
    <text x="284" y="350" fill="#5DC9E2" font-size="12">♻️ reusable: import it</text>

    <!-- Module B -->
    <rect x="490" y="124" width="266" height="272" rx="14" fill="#1E293B" stroke="#00ADD8" stroke-width="2"/>
    <text x="508" y="152" fill="#00ADD8" font-size="16" font-weight="700">MODULE</text>
    <text x="508" y="174" fill="#E2E8F0" font-size="13" font-family="Consolas, Menlo, monospace">module example.com/greetlib</text>
    <rect x="508" y="190" width="230" height="120" rx="12" fill="#0F172A" stroke="#00A29C" stroke-width="2"/>
    <text x="524" y="216" fill="#00A29C" font-size="15" font-weight="700">PACKAGE greetlib</text>
    <rect x="524" y="232" width="198" height="30" rx="6" fill="#1E293B"/>
    <text x="536" y="252" fill="#E2E8F0" font-size="13" font-family="Consolas, Menlo, monospace">greetlib.go</text>
    <text x="524" y="290" fill="#5DC9E2" font-size="12">♻️ reusable: import it</text>
    <text x="508" y="338" fill="#94A3B8" font-size="12">go.work lets example.com/app use</text>
    <text x="508" y="356" fill="#94A3B8" font-size="12">this local copy without publishing it.</text>
  </g>
</svg>
