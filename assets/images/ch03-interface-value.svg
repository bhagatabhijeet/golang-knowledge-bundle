<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="An interface value is a pair of dynamic type and dynamic value; it is nil only when both are nil">
  <rect width="800" height="400" rx="18" fill="#0F172A"/>
  <text x="400" y="42" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#E2E8F0">Inside an interface value: a (type, value) pair</text>

  <!-- three panels -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- panel 1 -->
    <rect x="25" y="70" width="240" height="300" rx="14" fill="#1E293B"/>
    <text x="145" y="100" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#5DC9E2">var s Shape = Rect{3, 4}</text>
    <rect x="55" y="125" width="180" height="46" rx="8" fill="none" stroke="#00ADD8" stroke-width="2"/>
    <text x="70" y="153" font-size="13" fill="#94A3B8">type</text>
    <text x="220" y="153" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="15" fill="#E2E8F0">Rect</text>
    <rect x="55" y="181" width="180" height="46" rx="8" fill="none" stroke="#00ADD8" stroke-width="2"/>
    <text x="70" y="209" font-size="13" fill="#94A3B8">value</text>
    <text x="220" y="209" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="15" fill="#E2E8F0">{W:3 H:4}</text>
    <text x="145" y="275" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#00A29C">s == nil → false</text>
    <text x="145" y="310" text-anchor="middle" font-size="14" fill="#94A3B8">Calls dispatch to</text>
    <text x="145" y="330" text-anchor="middle" font-size="14" fill="#94A3B8">Rect's methods.</text>

    <!-- panel 2 -->
    <rect x="280" y="70" width="240" height="300" rx="14" fill="#1E293B"/>
    <text x="400" y="100" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#5DC9E2">var err error</text>
    <rect x="310" y="125" width="180" height="46" rx="8" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="325" y="153" font-size="13" fill="#94A3B8">type</text>
    <text x="475" y="153" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="15" fill="#94A3B8">nil</text>
    <rect x="310" y="181" width="180" height="46" rx="8" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="325" y="209" font-size="13" fill="#94A3B8">value</text>
    <text x="475" y="209" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="15" fill="#94A3B8">nil</text>
    <text x="400" y="275" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#00A29C">err == nil → true</text>
    <text x="400" y="310" text-anchor="middle" font-size="14" fill="#94A3B8">Both halves empty:</text>
    <text x="400" y="330" text-anchor="middle" font-size="14" fill="#94A3B8">a real nil interface.</text>

    <!-- panel 3 -->
    <rect x="535" y="70" width="240" height="300" rx="14" fill="#1E293B" stroke="#CE3262" stroke-width="2"/>
    <text x="655" y="100" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="14" fill="#5DC9E2">var p *MyErr; err = p</text>
    <rect x="565" y="125" width="180" height="46" rx="8" fill="none" stroke="#CE3262" stroke-width="2"/>
    <text x="580" y="153" font-size="13" fill="#94A3B8">type</text>
    <text x="730" y="153" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="15" fill="#E2E8F0">*MyErr</text>
    <rect x="565" y="181" width="180" height="46" rx="8" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="580" y="209" font-size="13" fill="#94A3B8">value</text>
    <text x="730" y="209" text-anchor="end" font-family="Consolas, Menlo, monospace" font-size="15" fill="#94A3B8">nil</text>
    <text x="655" y="275" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#CE3262">err == nil → false!</text>
    <text x="655" y="310" text-anchor="middle" font-size="14" fill="#FDDD00">The type half is set,</text>
    <text x="655" y="330" text-anchor="middle" font-size="14" fill="#FDDD00">so it is not nil.</text>
  </g>
</svg>
