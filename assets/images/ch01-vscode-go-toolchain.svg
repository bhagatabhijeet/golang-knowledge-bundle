<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-labelledby="t d">
  <title id="t">How VS Code talks to Go</title>
  <desc id="d">The VS Code Go extension talks to gopls over the Language Server Protocol for completion and diagnostics, and to Delve (dlv) for debugging. Both rely on the go command and your module source.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="800" height="380" rx="18" fill="#0F172A"/>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="46" fill="#E2E8F0" font-size="22" font-weight="700">How VS Code talks to Go</text>
    <text x="40" y="70" fill="#94A3B8" font-size="14">The extension coordinates the tools; the tools do the real work</text>

    <!-- Editor -->
    <rect x="40" y="100" width="220" height="230" rx="14" fill="#1E293B" stroke="#5DC9E2" stroke-width="2"/>
    <text x="150" y="132" fill="#5DC9E2" font-size="17" font-weight="700" text-anchor="middle">VS Code</text>
    <rect x="62" y="148" width="176" height="62" rx="10" fill="#0F172A" stroke="#00ADD8" stroke-width="1.5"/>
    <text x="150" y="174" fill="#E2E8F0" font-size="14" font-weight="600" text-anchor="middle">Go extension</text>
    <text x="150" y="194" fill="#94A3B8" font-size="12" text-anchor="middle">golang.go</text>
    <text x="64" y="240" fill="#94A3B8" font-size="12.5">• completion &amp; hover</text>
    <text x="64" y="262" fill="#94A3B8" font-size="12.5">• format &amp; organize imports</text>
    <text x="64" y="284" fill="#94A3B8" font-size="12.5">• run / debug / test lenses</text>
    <text x="64" y="306" fill="#94A3B8" font-size="12.5">• lint on save</text>

    <!-- gopls -->
    <rect x="330" y="100" width="200" height="96" rx="14" fill="#1E293B" stroke="#00ADD8" stroke-width="2"/>
    <text x="430" y="134" fill="#00ADD8" font-size="17" font-weight="700" text-anchor="middle">gopls</text>
    <text x="430" y="158" fill="#E2E8F0" font-size="12.5" text-anchor="middle">official language server</text>
    <text x="430" y="178" fill="#94A3B8" font-size="12" text-anchor="middle">types · references · rename</text>

    <!-- dlv -->
    <rect x="330" y="234" width="200" height="96" rx="14" fill="#1E293B" stroke="#CE3262" stroke-width="2"/>
    <text x="430" y="268" fill="#CE3262" font-size="17" font-weight="700" text-anchor="middle">dlv (Delve)</text>
    <text x="430" y="292" fill="#E2E8F0" font-size="12.5" text-anchor="middle">debugger</text>
    <text x="430" y="312" fill="#94A3B8" font-size="12" text-anchor="middle">breakpoints · step · inspect</text>

    <!-- go toolchain -->
    <rect x="600" y="100" width="160" height="230" rx="14" fill="#1E293B" stroke="#FDDD00" stroke-width="2"/>
    <text x="680" y="134" fill="#FDDD00" font-size="17" font-weight="700" text-anchor="middle">go command</text>
    <g font-family="Consolas, Menlo, monospace" font-size="13" fill="#E2E8F0" text-anchor="middle">
      <text x="680" y="170">go build</text>
      <text x="680" y="196">go test</text>
      <text x="680" y="222">go vet</text>
      <text x="680" y="248">go mod</text>
      <text x="680" y="274">gofmt</text>
    </g>
    <text x="680" y="310" fill="#94A3B8" font-size="12" text-anchor="middle">+ your go.mod</text>

    <!-- arrows -->
    <line x1="262" y1="160" x2="326" y2="148" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
    <text x="294" y="140" fill="#94A3B8" font-size="11" text-anchor="middle">LSP</text>
    <line x1="262" y1="270" x2="326" y2="282" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
    <text x="294" y="300" fill="#94A3B8" font-size="11" text-anchor="middle">DAP</text>
    <line x1="532" y1="148" x2="596" y2="160" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/>
    <line x1="532" y1="282" x2="596" y2="270" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/>
  </g>
</svg>
