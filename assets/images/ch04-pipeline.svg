<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-label="Pipeline: a generate stage fans out to three square workers, whose outputs fan in through merge to a single consumer, all connected by channels">
  <title>Pipeline with fan-out and fan-in</title>
  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5DC9E2"/>
    </marker>
  </defs>
  <rect width="800" height="380" rx="18" fill="#0F172A"/>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="400" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#E2E8F0">Pipeline: Fan-out → Fan-in</text>
    <text x="400" y="60" text-anchor="middle" font-size="13" fill="#94A3B8">each arrow is a channel · each box is a goroutine</text>

    <!-- stage labels -->
    <g font-size="12" fill="#94A3B8" text-anchor="middle">
      <text x="110" y="92">stage 1 · source</text>
      <text x="330" y="92">stage 2 · fan-out</text>
      <text x="530" y="92">stage 3 · fan-in</text>
      <text x="700" y="92">sink</text>
    </g>

    <!-- generate -->
    <rect x="40" y="180" width="140" height="60" rx="12" fill="#00A29C"/>
    <text x="110" y="207" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">generate</text>
    <text x="110" y="226" text-anchor="middle" font-size="12" fill="#0F172A">1, 2, 3, …</text>

    <!-- workers -->
    <g>
      <rect x="260" y="110" width="140" height="52" rx="12" fill="#00ADD8"/>
      <text x="330" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">square #1</text>
      <rect x="260" y="184" width="140" height="52" rx="12" fill="#00ADD8"/>
      <text x="330" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">square #2</text>
      <rect x="260" y="258" width="140" height="52" rx="12" fill="#00ADD8"/>
      <text x="330" y="290" text-anchor="middle" font-size="14" font-weight="700" fill="#0F172A">square #3</text>
    </g>

    <!-- merge -->
    <rect x="470" y="180" width="120" height="60" rx="12" fill="#FDDD00"/>
    <text x="530" y="207" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">merge</text>
    <text x="530" y="226" text-anchor="middle" font-size="11" fill="#0F172A">WaitGroup → close</text>

    <!-- sink -->
    <rect x="640" y="180" width="120" height="60" rx="12" fill="#1E293B" stroke="#5DC9E2" stroke-width="2"/>
    <text x="700" y="207" text-anchor="middle" font-size="14" font-weight="700" fill="#E2E8F0">main</text>
    <text x="700" y="226" text-anchor="middle" font-size="11" fill="#E2E8F0" font-family="Consolas, Menlo, monospace">for v := range</text>

    <!-- arrows -->
    <g stroke="#5DC9E2" stroke-width="2.2" fill="none">
      <path d="M180 200 C 220 190, 220 140, 254 136" marker-end="url(#p)"/>
      <path d="M180 210 L 254 210" marker-end="url(#p)"/>
      <path d="M180 220 C 220 230, 220 280, 254 284" marker-end="url(#p)"/>
      <path d="M400 136 C 440 140, 440 195, 464 200" marker-end="url(#p)"/>
      <path d="M400 210 L 464 210" marker-end="url(#p)"/>
      <path d="M400 284 C 440 280, 440 225, 464 220" marker-end="url(#p)"/>
      <path d="M590 210 L 634 210" marker-end="url(#p)"/>
    </g>

    <!-- ctx bar -->
    <rect x="40" y="330" width="720" height="30" rx="8" fill="#1E293B" stroke="#CE3262" stroke-dasharray="6 4"/>
    <text x="400" y="350" text-anchor="middle" font-size="12" fill="#E2E8F0">ctx.Done() reaches every stage: cancel once and the whole pipeline unwinds with no leaks</text>
  </g>
</svg>
