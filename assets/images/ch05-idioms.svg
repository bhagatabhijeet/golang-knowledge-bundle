<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="Six Go idioms on cards: gofmt is everyone's style, accept interfaces and return structs, make the zero value useful, return early, errors are values, and clear is better than clever">
  <rect width="800" height="420" rx="18" fill="#0F172A"/>
  <text x="400" y="42" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#E2E8F0">Six habits that make code feel like Go</text>
  <text x="400" y="66" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8">idiomatic = what the next reader expects</text>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <!-- row 1 -->
    <rect x="30" y="90" width="236" height="140" rx="14" fill="#1E293B" stroke="#00ADD8" stroke-width="2"/>
    <text x="48" y="122" font-size="26" font-weight="800" fill="#00ADD8">01</text>
    <text x="48" y="152" font-size="16" font-weight="700" fill="#E2E8F0">gofmt is the style</text>
    <text x="48" y="178" font-size="13" fill="#94A3B8">No debates about tabs or</text>
    <text x="48" y="196" font-size="13" fill="#94A3B8">braces. Format on save.</text>

    <rect x="282" y="90" width="236" height="140" rx="14" fill="#1E293B" stroke="#5DC9E2" stroke-width="2"/>
    <text x="300" y="122" font-size="26" font-weight="800" fill="#5DC9E2">02</text>
    <text x="300" y="152" font-size="16" font-weight="700" fill="#E2E8F0">Accept interfaces,</text>
    <text x="300" y="172" font-size="16" font-weight="700" fill="#E2E8F0">return structs</text>
    <text x="300" y="198" font-size="13" fill="#94A3B8">Flexible in, concrete out.</text>

    <rect x="534" y="90" width="236" height="140" rx="14" fill="#1E293B" stroke="#00A29C" stroke-width="2"/>
    <text x="552" y="122" font-size="26" font-weight="800" fill="#00A29C">03</text>
    <text x="552" y="152" font-size="16" font-weight="700" fill="#E2E8F0">Useful zero values</text>
    <text x="552" y="178" font-size="13" fill="#94A3B8">var mu sync.Mutex just works.</text>
    <text x="552" y="196" font-size="13" fill="#94A3B8">So should your types.</text>

    <!-- row 2 -->
    <rect x="30" y="248" width="236" height="140" rx="14" fill="#1E293B" stroke="#FDDD00" stroke-width="2"/>
    <text x="48" y="280" font-size="26" font-weight="800" fill="#FDDD00">04</text>
    <text x="48" y="310" font-size="16" font-weight="700" fill="#E2E8F0">Return early</text>
    <text x="48" y="336" font-size="13" fill="#94A3B8">Handle errors first; keep the</text>
    <text x="48" y="354" font-size="13" fill="#94A3B8">happy path flush left.</text>

    <rect x="282" y="248" width="236" height="140" rx="14" fill="#1E293B" stroke="#CE3262" stroke-width="2"/>
    <text x="300" y="280" font-size="26" font-weight="800" fill="#CE3262">05</text>
    <text x="300" y="310" font-size="16" font-weight="700" fill="#E2E8F0">Errors are values</text>
    <text x="300" y="336" font-size="13" fill="#94A3B8">Wrap with %w, inspect with</text>
    <text x="300" y="354" font-size="13" fill="#94A3B8">errors.Is / errors.As.</text>

    <rect x="534" y="248" width="236" height="140" rx="14" fill="#1E293B" stroke="#E2E8F0" stroke-width="2"/>
    <text x="552" y="280" font-size="26" font-weight="800" fill="#E2E8F0">06</text>
    <text x="552" y="310" font-size="16" font-weight="700" fill="#E2E8F0">Clear over clever</text>
    <text x="552" y="336" font-size="13" fill="#94A3B8">A little copying beats a</text>
    <text x="552" y="354" font-size="13" fill="#94A3B8">little dependency.</text>
  </g>
</svg>
