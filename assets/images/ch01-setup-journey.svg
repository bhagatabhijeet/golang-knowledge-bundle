<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="t d">
  <title id="t">Your setup journey</title>
  <desc id="d">Five steps: install Go, install VS Code, add the Go extension, install the Go tools, run Hello World.</desc>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#00ADD8"/>
      <stop offset="1" stop-color="#00A29C"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" rx="18" fill="#0F172A"/>
  <text x="40" y="48" fill="#E2E8F0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700">Your setup journey</text>
  <text x="40" y="72" fill="#94A3B8" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">About 15 minutes from a blank machine to your first running program</text>
  <line x1="88" y1="160" x2="712" y2="160" stroke="url(#g)" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"/>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(88,160)">
      <circle r="38" fill="#1E293B" stroke="#00ADD8" stroke-width="3"/>
      <text y="9" fill="#00ADD8" font-size="26" font-weight="700">1</text>
      <text y="68" fill="#E2E8F0" font-size="15" font-weight="600">Install Go</text>
      <text y="88" fill="#94A3B8" font-size="12">go.dev/dl</text>
    </g>
    <g transform="translate(244,160)">
      <circle r="38" fill="#1E293B" stroke="#5DC9E2" stroke-width="3"/>
      <text y="9" fill="#5DC9E2" font-size="26" font-weight="700">2</text>
      <text y="68" fill="#E2E8F0" font-size="15" font-weight="600">Install VS Code</text>
      <text y="88" fill="#94A3B8" font-size="12">code.visualstudio.com</text>
    </g>
    <g transform="translate(400,160)">
      <circle r="38" fill="#1E293B" stroke="#00A29C" stroke-width="3"/>
      <text y="9" fill="#00A29C" font-size="26" font-weight="700">3</text>
      <text y="68" fill="#E2E8F0" font-size="15" font-weight="600">Go extension</text>
      <text y="88" fill="#94A3B8" font-size="12">golang.go</text>
    </g>
    <g transform="translate(556,160)">
      <circle r="38" fill="#1E293B" stroke="#FDDD00" stroke-width="3"/>
      <text y="9" fill="#FDDD00" font-size="26" font-weight="700">4</text>
      <text y="68" fill="#E2E8F0" font-size="15" font-weight="600">Install Go tools</text>
      <text y="88" fill="#94A3B8" font-size="11.5">Go: Install/Update Tools</text>
      <text y="106" fill="#94A3B8" font-size="11">gopls · dlv · staticcheck</text>
    </g>
    <g transform="translate(712,160)">
      <circle r="38" fill="#CE3262"/>
      <path d="M-12 1 l8 9 l17 -19" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text y="68" fill="#E2E8F0" font-size="15" font-weight="600">Hello, World!</text>
      <text y="88" fill="#94A3B8" font-size="12">go run .</text>
    </g>
  </g>
</svg>
