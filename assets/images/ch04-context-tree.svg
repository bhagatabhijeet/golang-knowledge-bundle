<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-label="Context tree: Background at the root, a request context with a timeout, and child contexts for database, cache and API calls; cancelling a parent cancels all its descendants but not its parent">
  <title>Cancellation flows down the context tree</title>
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#CE3262"/>
    </marker>
  </defs>
  <rect width="800" height="420" rx="18" fill="#0F172A"/>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="400" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#E2E8F0">Cancellation Flows Down the Tree</text>

    <!-- edges -->
    <g stroke="#94A3B8" stroke-width="2">
      <line x1="400" y1="104" x2="400" y2="150"/>
      <line x1="400" y1="196" x2="180" y2="262"/>
      <line x1="400" y1="196" x2="400" y2="262"/>
      <line x1="400" y1="196" x2="620" y2="262"/>
      <line x1="620" y1="308" x2="620" y2="346"/>
    </g>

    <!-- nodes -->
    <g font-family="Consolas, Menlo, monospace" font-size="13">
      <rect x="290" y="62" width="220" height="42" rx="10" fill="#1E293B" stroke="#94A3B8" stroke-width="2"/>
      <text x="400" y="89" text-anchor="middle" fill="#E2E8F0">context.Background()</text>

      <rect x="260" y="150" width="280" height="46" rx="10" fill="#CE3262"/>
      <text x="400" y="171" text-anchor="middle" fill="#0F172A" font-weight="700">WithTimeout(req, 2s)</text>
      <text x="400" y="188" text-anchor="middle" fill="#0F172A" font-size="11">deadline hit → Done() closes</text>

      <rect x="90" y="262" width="180" height="46" rx="10" fill="#1E293B" stroke="#CE3262" stroke-width="2"/>
      <text x="180" y="290" text-anchor="middle" fill="#E2E8F0">db query</text>
      <rect x="310" y="262" width="180" height="46" rx="10" fill="#1E293B" stroke="#CE3262" stroke-width="2"/>
      <text x="400" y="290" text-anchor="middle" fill="#E2E8F0">cache lookup</text>
      <rect x="530" y="262" width="180" height="46" rx="10" fill="#1E293B" stroke="#CE3262" stroke-width="2"/>
      <text x="620" y="290" text-anchor="middle" fill="#E2E8F0">WithCancel: API</text>
      <rect x="530" y="346" width="180" height="42" rx="10" fill="#1E293B" stroke="#CE3262" stroke-width="2"/>
      <text x="620" y="372" text-anchor="middle" fill="#E2E8F0">retry goroutine</text>
    </g>

    <!-- cancel signal -->
    <path d="M 545 172 C 640 172, 700 200, 700 250" fill="none" stroke="#CE3262" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#c)"/>
    <text x="690" y="166" font-size="12" font-weight="700" fill="#CE3262">cancel ↓</text>

    <!-- notes -->
    <text x="40" y="350" font-size="13" fill="#E2E8F0">✔ Cancelling a parent cancels every descendant</text>
    <text x="40" y="372" font-size="13" fill="#E2E8F0">✘ Cancelling a child never touches its parent</text>
    <text x="40" y="394" font-size="12" fill="#94A3B8">Values are looked up from the child toward the root</text>
    <text x="410" y="132" font-size="11" fill="#94A3B8">never cancelled</text>
  </g>
</svg>
