<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-label="Each layer wraps the error with %w; errors.Is walks the chain down to the sentinel">
  <rect width="800" height="360" rx="18" fill="#0F172A"/>
  <text x="400" y="42" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#E2E8F0">Wrapping builds a chain; errors.Is walks it</text>

  <g font-family="Consolas, Menlo, monospace">
    <!-- nested boxes -->
    <rect x="40" y="75" width="520" height="250" rx="14" fill="#1E293B" stroke="#5DC9E2" stroke-width="2"/>
    <text x="60" y="104" font-size="15" fill="#5DC9E2">fmt.Errorf("handler: %w", err)</text>
    <rect x="70" y="122" width="460" height="180" rx="12" fill="#0F172A" stroke="#00ADD8" stroke-width="2"/>
    <text x="90" y="151" font-size="15" fill="#00ADD8">fmt.Errorf("findUser(42): %w", ErrNotFound)</text>
    <rect x="100" y="172" width="400" height="104" rx="10" fill="#1E293B" stroke="#FDDD00" stroke-width="2.5"/>
    <text x="300" y="210" text-anchor="middle" font-size="16" fill="#FDDD00">ErrNotFound</text>
    <text x="300" y="240" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#94A3B8">errors.New("not found"): the sentinel</text>
    <text x="300" y="262" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8">the root cause, preserved intact</text>
  </g>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="585" y="75" width="190" height="250" rx="14" fill="#1E293B"/>
    <text x="680" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#E2E8F0">errors.Is(err,</text>
    <text x="680" y="126" text-anchor="middle" font-size="15" font-weight="700" fill="#E2E8F0">ErrNotFound)</text>
    <text x="605" y="165" font-size="14" fill="#94A3B8">1. handler: …  ✗</text>
    <path d="M680 175 v14" stroke="#94A3B8" stroke-width="2"/>
    <text x="605" y="210" font-size="14" fill="#94A3B8">2. findUser…  ✗</text>
    <path d="M680 220 v14" stroke="#94A3B8" stroke-width="2"/>
    <text x="605" y="255" font-size="14" fill="#00A29C">3. ErrNotFound ✓</text>
    <text x="680" y="298" text-anchor="middle" font-size="16" font-weight="700" fill="#00A29C">→ true</text>
  </g>
</svg>
