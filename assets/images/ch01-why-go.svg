<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-labelledby="t d">
  <title id="t">The four pillars of Go</title>
  <desc id="d">Go rests on four pillars: simplicity, fast builds and fast binaries, built-in concurrency, and batteries-included tooling.</desc>
  <rect width="800" height="320" rx="18" fill="#0F172A"/>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="400" y="50" fill="#E2E8F0" font-size="24" font-weight="700">The four pillars of Go</text>
    <text x="400" y="76" fill="#94A3B8" font-size="14">Designed at Google in 2007 · open-sourced 2009 · Go 1.0 in 2012</text>

    <g transform="translate(40,100)">
      <rect width="165" height="190" rx="14" fill="#1E293B" stroke="#00ADD8" stroke-width="2"/>
      <rect x="57" y="22" width="50" height="50" rx="10" fill="none" stroke="#00ADD8" stroke-width="3"/>
      <line x1="69" y1="40" x2="95" y2="40" stroke="#00ADD8" stroke-width="3" stroke-linecap="round"/>
      <line x1="69" y1="54" x2="88" y2="54" stroke="#00ADD8" stroke-width="3" stroke-linecap="round"/>
      <text x="82" y="102" fill="#00ADD8" font-size="17" font-weight="700">Simplicity</text>
      <text x="82" y="128" fill="#E2E8F0" font-size="12.5">25 keywords</text>
      <text x="82" y="148" fill="#94A3B8" font-size="12">One way to format,</text>
      <text x="82" y="166" fill="#94A3B8" font-size="12">few ways to do a thing</text>
    </g>
    <g transform="translate(225,100)">
      <rect width="165" height="190" rx="14" fill="#1E293B" stroke="#FDDD00" stroke-width="2"/>
      <path d="M90 20 L66 52 H84 L74 76 L100 42 H82 Z" fill="#FDDD00"/>
      <text x="82" y="102" fill="#FDDD00" font-size="17" font-weight="700">Speed</text>
      <text x="82" y="128" fill="#E2E8F0" font-size="12.5">Seconds to compile</text>
      <text x="82" y="148" fill="#94A3B8" font-size="12">Native code, one</text>
      <text x="82" y="166" fill="#94A3B8" font-size="12">static binary</text>
    </g>
    <g transform="translate(410,100)">
      <rect width="165" height="190" rx="14" fill="#1E293B" stroke="#00A29C" stroke-width="2"/>
      <path d="M60 34 H104 M60 48 H104 M60 62 H104" stroke="#00A29C" stroke-width="3" stroke-linecap="round"/>
      <circle cx="74" cy="34" r="5" fill="#00A29C"/><circle cx="92" cy="48" r="5" fill="#00A29C"/><circle cx="66" cy="62" r="5" fill="#00A29C"/>
      <text x="82" y="102" fill="#00A29C" font-size="17" font-weight="700">Concurrency</text>
      <text x="82" y="128" fill="#E2E8F0" font-size="12.5">go + chan</text>
      <text x="82" y="148" fill="#94A3B8" font-size="12">Millions of cheap</text>
      <text x="82" y="166" fill="#94A3B8" font-size="12">goroutines</text>
    </g>
    <g transform="translate(595,100)">
      <rect width="165" height="190" rx="14" fill="#1E293B" stroke="#CE3262" stroke-width="2"/>
      <circle cx="82" cy="47" r="22" fill="none" stroke="#CE3262" stroke-width="3"/>
      <circle cx="82" cy="47" r="8" fill="#CE3262"/>
      <text x="82" y="102" fill="#CE3262" font-size="17" font-weight="700">Tooling</text>
      <text x="82" y="128" fill="#E2E8F0" font-size="12.5">fmt · test · vet · mod</text>
      <text x="82" y="148" fill="#94A3B8" font-size="12">Everything ships</text>
      <text x="82" y="166" fill="#94A3B8" font-size="12">in the box</text>
    </g>
  </g>
</svg>
