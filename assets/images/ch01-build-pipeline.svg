<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="t d">
  <title id="t">From source to single binary</title>
  <desc id="d">Source and go.mod go through go build, which produces one self-contained binary. Setting GOOS and GOARCH targets other platforms such as linux/amd64, darwin/arm64 and windows/amd64.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/>
    </marker>
  </defs>
  <rect width="800" height="330" rx="18" fill="#0F172A"/>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="46" fill="#E2E8F0" font-size="22" font-weight="700">From source to a single binary</text>
    <text x="40" y="70" fill="#94A3B8" font-size="14">No runtime to install on the target machine, no dependency hunt</text>

    <rect x="40" y="110" width="170" height="150" rx="14" fill="#1E293B" stroke="#5DC9E2" stroke-width="2"/>
    <text x="125" y="140" fill="#5DC9E2" font-size="15" font-weight="700" text-anchor="middle">Your code</text>
    <g font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#E2E8F0">
      <text x="62" y="172">main.go</text>
      <text x="62" y="194">cart/cart.go</text>
      <text x="62" y="216">go.mod</text>
      <text x="62" y="238">go.sum</text>
    </g>

    <rect x="270" y="145" width="160" height="80" rx="40" fill="#00ADD8"/>
    <text x="350" y="182" fill="#0F172A" font-family="Consolas, Menlo, monospace" font-size="17" font-weight="700" text-anchor="middle">go build</text>
    <text x="350" y="204" fill="#0F172A" font-size="12" text-anchor="middle">compile + link</text>

    <line x1="212" y1="185" x2="266" y2="185" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/>

    <g font-size="13">
      <rect x="520" y="96" width="240" height="52" rx="10" fill="#1E293B" stroke="#00A29C" stroke-width="2"/>
      <text x="538" y="120" fill="#00A29C" font-weight="700">linux/amd64</text>
      <text x="538" y="138" fill="#94A3B8" font-family="Consolas, Menlo, monospace" font-size="11.5">GOOS=linux GOARCH=amd64</text>
      <rect x="520" y="160" width="240" height="52" rx="10" fill="#1E293B" stroke="#FDDD00" stroke-width="2"/>
      <text x="538" y="184" fill="#FDDD00" font-weight="700">darwin/arm64</text>
      <text x="538" y="202" fill="#94A3B8" font-family="Consolas, Menlo, monospace" font-size="11.5">GOOS=darwin GOARCH=arm64</text>
      <rect x="520" y="224" width="240" height="52" rx="10" fill="#1E293B" stroke="#CE3262" stroke-width="2"/>
      <text x="538" y="248" fill="#CE3262" font-weight="700">windows/amd64 (.exe)</text>
      <text x="538" y="266" fill="#94A3B8" font-family="Consolas, Menlo, monospace" font-size="11.5">GOOS=windows GOARCH=amd64</text>
    </g>
    <line x1="432" y1="175" x2="516" y2="124" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/>
    <line x1="432" y1="185" x2="516" y2="186" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/>
    <line x1="432" y1="195" x2="516" y2="248" stroke="#94A3B8" stroke-width="2" marker-end="url(#a)"/>
    <text x="400" y="306" fill="#94A3B8" font-size="13" text-anchor="middle">Same source, any target: just set two environment variables.</text>
  </g>
</svg>
