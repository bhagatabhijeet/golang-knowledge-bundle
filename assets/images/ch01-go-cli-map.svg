<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-labelledby="t d">
  <title id="t">Six commands, one workflow</title>
  <desc id="d">The developer cycle with the go command: go get adds dependencies to go.mod, then you write code, go fmt tidies it, go run tries it, go test proves it, go build ships a binary, and go install puts it on your PATH.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/>
    </marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#FDDD00"/>
    </marker>
  </defs>
  <rect width="800" height="400" rx="20" fill="#0F172A"/>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="40" y="48" fill="#E2E8F0" font-size="24" font-weight="700">Six commands, one workflow</text>
    <text x="40" y="74" fill="#94A3B8" font-size="14">The loop you will run hundreds of times a day</text>
  </g>

  <!-- go get side feed -->
  <g>
    <rect x="40" y="120" width="150" height="56" rx="28" fill="#FDDD00"/>
    <text x="115" y="154" text-anchor="middle" fill="#0F172A" font-family="Consolas, Menlo, monospace" font-size="18" font-weight="700">go get</text>
    <text x="115" y="196" text-anchor="middle" fill="#94A3B8" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">add dependencies</text>
    <rect x="58" y="232" width="114" height="44" rx="8" fill="#1E293B" stroke="#FDDD00" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="115" y="259" text-anchor="middle" fill="#FDDD00" font-family="Consolas, Menlo, monospace" font-size="14">go.mod</text>
    <path d="M115 206 L115 228" stroke="#FDDD00" stroke-width="2" marker-end="url(#ay)"/>
    <path d="M172 254 L222 254" stroke="#FDDD00" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ay)"/>
  </g>

  <!-- write code hub -->
  <rect x="228" y="226" width="124" height="56" rx="12" fill="#1E293B" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="290" y="252" text-anchor="middle" fill="#E2E8F0" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">write code</text>
  <text x="290" y="270" text-anchor="middle" fill="#94A3B8" font-family="Consolas, Menlo, monospace" font-size="12">*.go</text>

  <!-- Pills: top row fmt run test, right build install -->
  <g font-family="Consolas, Menlo, monospace" font-size="17" font-weight="700" text-anchor="middle">
    <rect x="250" y="120" width="130" height="50" rx="25" fill="#5DC9E2"/>
    <text x="315" y="151" fill="#0F172A">go fmt</text>
    <rect x="420" y="120" width="130" height="50" rx="25" fill="#00ADD8"/>
    <text x="485" y="151" fill="#0F172A">go run</text>
    <rect x="590" y="120" width="150" height="50" rx="25" fill="#00A29C"/>
    <text x="665" y="151" fill="#0F172A">go test</text>
    <rect x="590" y="232" width="150" height="50" rx="25" fill="#CE3262"/>
    <text x="665" y="263" fill="#E2E8F0">go build</text>
    <rect x="420" y="312" width="150" height="50" rx="25" fill="#E2E8F0"/>
    <text x="495" y="343" fill="#0F172A">go install</text>
  </g>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8" text-anchor="middle">
    <text x="315" y="106">tidy it</text>
    <text x="485" y="106">try it</text>
    <text x="665" y="106">prove it</text>
    <text x="665" y="302">ship a binary</text>
    <text x="495" y="380">put it on your PATH ($GOBIN)</text>
  </g>

  <!-- Arrows -->
  <g stroke="#94A3B8" stroke-width="2" fill="none">
    <path d="M290 226 L305 176" marker-end="url(#a)"/>
    <path d="M380 145 L414 145" marker-end="url(#a)"/>
    <path d="M550 145 L584 145" marker-end="url(#a)"/>
    <path d="M665 170 L665 226" marker-end="url(#a)"/>
    <path d="M640 282 L560 310" marker-end="url(#a)"/>
    <!-- loop back from test to write code -->
    <path d="M600 168 Q 470 220 358 244" stroke-dasharray="4 5" marker-end="url(#a)"/>
  </g>
  <text x="490" y="250" text-anchor="middle" fill="#94A3B8" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-style="italic">red test? back to the code</text>
</svg>
