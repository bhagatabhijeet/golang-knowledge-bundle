<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-label="A typical Go server project layout: go.mod at the root, cmd directory for binaries, internal directory for private packages, plus testdata and docs, with notes on what each directory means">
  <rect width="800" height="460" rx="18" fill="#0F172A"/>
  <text x="400" y="40" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#E2E8F0">A Go service, laid out</text>
  <text x="400" y="63" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#94A3B8">start flat, grow into this only when the code asks for it</text>

  <rect x="30" y="84" width="340" height="350" rx="14" fill="#1E293B"/>
  <g font-family="Consolas, Menlo, monospace" font-size="14">
    <text x="50" y="116" fill="#FDDD00">bookstore/</text>
    <text x="50" y="144" fill="#94A3B8">├─ <tspan fill="#E2E8F0">go.mod</tspan></text>
    <text x="50" y="170" fill="#94A3B8">├─ <tspan fill="#E2E8F0">go.sum</tspan></text>
    <text x="50" y="196" fill="#94A3B8">├─ <tspan fill="#00ADD8">cmd/</tspan></text>
    <text x="50" y="222" fill="#94A3B8">│  ├─ <tspan fill="#00ADD8">api/</tspan><tspan fill="#E2E8F0">main.go</tspan></text>
    <text x="50" y="248" fill="#94A3B8">│  └─ <tspan fill="#00ADD8">migrate/</tspan><tspan fill="#E2E8F0">main.go</tspan></text>
    <text x="50" y="274" fill="#94A3B8">├─ <tspan fill="#CE3262">internal/</tspan></text>
    <text x="50" y="300" fill="#94A3B8">│  ├─ <tspan fill="#CE3262">store/</tspan></text>
    <text x="50" y="326" fill="#94A3B8">│  ├─ <tspan fill="#CE3262">httpapi/</tspan></text>
    <text x="50" y="352" fill="#94A3B8">│  └─ <tspan fill="#CE3262">billing/</tspan></text>
    <text x="50" y="378" fill="#94A3B8">├─ <tspan fill="#00A29C">testdata/</tspan></text>
    <text x="50" y="404" fill="#94A3B8">└─ <tspan fill="#E2E8F0">README.md</tspan></text>
  </g>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="396" y="96" width="374" height="70" rx="12" fill="#1E293B" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="414" y="122" font-size="15" font-weight="700" fill="#E2E8F0">go.mod — the module root</text>
    <text x="414" y="146" font-size="13" fill="#94A3B8">Module path + Go version + dependencies.</text>

    <rect x="396" y="180" width="374" height="76" rx="12" fill="#1E293B" stroke="#00ADD8" stroke-width="1.5"/>
    <text x="414" y="206" font-size="15" font-weight="700" fill="#00ADD8">cmd/&lt;name&gt;/ — one dir per binary</text>
    <text x="414" y="230" font-size="13" fill="#94A3B8">Tiny package main: parse flags, wire deps, run.</text>
    <text x="414" y="248" font-family="Consolas, Menlo, monospace" font-size="12" fill="#E2E8F0">go install ./cmd/api</text>

    <rect x="396" y="270" width="374" height="76" rx="12" fill="#1E293B" stroke="#CE3262" stroke-width="1.5"/>
    <text x="414" y="296" font-size="15" font-weight="700" fill="#CE3262">internal/ — enforced by the compiler</text>
    <text x="414" y="320" font-size="13" fill="#94A3B8">Only code under bookstore/ may import it.</text>
    <text x="414" y="338" font-size="13" fill="#94A3B8">Refactor freely: no outside users can break.</text>

    <rect x="396" y="360" width="374" height="70" rx="12" fill="#1E293B" stroke="#00A29C" stroke-width="1.5"/>
    <text x="414" y="386" font-size="15" font-weight="700" fill="#00A29C">testdata/ — ignored by the go tool</text>
    <text x="414" y="410" font-size="13" fill="#94A3B8">Fixtures and golden files for tests.</text>
  </g>
</svg>
