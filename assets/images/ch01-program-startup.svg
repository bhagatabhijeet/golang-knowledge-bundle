<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="t d">
  <title id="t">How a Go program starts</title>
  <desc id="d">Startup order: imported packages initialize first (variables, then init functions), then package main's variables, then main's init, then func main.</desc>
  <rect width="800" height="300" rx="20" fill="#0F172A"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#FDDD00"/></marker>
  </defs>
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="400" y="38" text-anchor="middle" fill="#E2E8F0" font-size="22" font-weight="700">What happens when you run a Go program</text>
    <text x="400" y="62" text-anchor="middle" fill="#94A3B8" font-size="14">Dependencies first, main last. Every step runs once, in this order.</text>

    <rect x="30" y="92" width="350" height="150" rx="14" fill="#1E293B" stroke="#00A29C" stroke-width="2"/>
    <text x="48" y="120" fill="#00A29C" font-size="15" font-weight="700">Imported packages (e.g. shapes)</text>
    <rect x="48" y="136" width="150" height="56" rx="10" fill="#0F172A" stroke="#5DC9E2"/>
    <text x="123" y="160" text-anchor="middle" fill="#E2E8F0" font-size="14" font-weight="600">① package vars</text>
    <text x="123" y="180" text-anchor="middle" fill="#94A3B8" font-size="11" font-family="Consolas, Menlo, monospace">var Registered = …</text>
    <rect x="214" y="136" width="150" height="56" rx="10" fill="#0F172A" stroke="#5DC9E2"/>
    <text x="289" y="160" text-anchor="middle" fill="#E2E8F0" font-size="14" font-weight="600">② init()</text>
    <text x="289" y="180" text-anchor="middle" fill="#94A3B8" font-size="11" font-family="Consolas, Menlo, monospace">func init() {…}</text>
    <line x1="198" y1="164" x2="212" y2="164" stroke="#FDDD00" stroke-width="2" marker-end="url(#a)"/>
    <text x="48" y="222" fill="#94A3B8" font-size="12">Deepest dependency first; each package only once.</text>

    <line x1="382" y1="164" x2="416" y2="164" stroke="#FDDD00" stroke-width="2.5" marker-end="url(#a)"/>

    <rect x="420" y="92" width="350" height="150" rx="14" fill="#1E293B" stroke="#CE3262" stroke-width="2"/>
    <text x="438" y="120" fill="#CE3262" font-size="15" font-weight="700">package main</text>
    <rect x="438" y="136" width="96" height="56" rx="10" fill="#0F172A" stroke="#CE3262"/>
    <text x="486" y="160" text-anchor="middle" fill="#E2E8F0" font-size="13" font-weight="600">③ vars</text>
    <text x="486" y="180" text-anchor="middle" fill="#94A3B8" font-size="11" font-family="Consolas, Menlo, monospace">var banner</text>
    <rect x="548" y="136" width="96" height="56" rx="10" fill="#0F172A" stroke="#CE3262"/>
    <text x="596" y="160" text-anchor="middle" fill="#E2E8F0" font-size="13" font-weight="600">④ init()</text>
    <text x="596" y="180" text-anchor="middle" fill="#94A3B8" font-size="11" font-family="Consolas, Menlo, monospace">setup</text>
    <rect x="658" y="136" width="96" height="56" rx="10" fill="#00ADD8"/>
    <text x="706" y="160" text-anchor="middle" fill="#0F172A" font-size="13" font-weight="800">⑤ main()</text>
    <text x="706" y="180" text-anchor="middle" fill="#0F172A" font-size="11" font-family="Consolas, Menlo, monospace">your program</text>
    <line x1="534" y1="164" x2="546" y2="164" stroke="#FDDD00" stroke-width="2" marker-end="url(#a)"/>
    <line x1="644" y1="164" x2="656" y2="164" stroke="#FDDD00" stroke-width="2" marker-end="url(#a)"/>
    <text x="438" y="222" fill="#94A3B8" font-size="12">When main() returns, the program exits.</text>

    <text x="400" y="276" text-anchor="middle" fill="#FDDD00" font-size="13">No main() in package main → "function main is undeclared in the main package"</text>
  </g>
</svg>
