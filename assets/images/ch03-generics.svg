<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-label="A generic function is a template; the type argument is inferred and the constraint decides which types are allowed">
  <rect width="800" height="340" rx="18" fill="#0F172A"/>
  <text x="400" y="42" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#E2E8F0">One function, many types: the constraint is the gatekeeper</text>

  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="190" y="70" width="420" height="62" rx="12" fill="#1E293B" stroke="#00ADD8" stroke-width="2.5"/>
    <text x="400" y="99" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="17" fill="#E2E8F0">func Max[T <tspan fill="#FDDD00">cmp.Ordered</tspan>](a, b T) T</text>
    <text x="400" y="121" text-anchor="middle" font-size="13" fill="#94A3B8">type parameter T, constraint cmp.Ordered</text>

    <path d="M300 132 L130 200 M400 132 L400 200 M500 132 L670 200" stroke="#5DC9E2" stroke-width="2"/>

    <rect x="35" y="200" width="190" height="96" rx="12" fill="#1E293B" stroke="#00A29C" stroke-width="2"/>
    <text x="130" y="230" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="15" fill="#E2E8F0">Max(3, 7)</text>
    <text x="130" y="256" text-anchor="middle" font-size="13" fill="#94A3B8">T inferred as int</text>
    <text x="130" y="281" text-anchor="middle" font-size="15" fill="#00A29C">✓ allowed</text>

    <rect x="305" y="200" width="190" height="96" rx="12" fill="#1E293B" stroke="#00A29C" stroke-width="2"/>
    <text x="400" y="230" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="15" fill="#E2E8F0">Max("a", "b")</text>
    <text x="400" y="256" text-anchor="middle" font-size="13" fill="#94A3B8">T inferred as string</text>
    <text x="400" y="281" text-anchor="middle" font-size="15" fill="#00A29C">✓ allowed</text>

    <rect x="575" y="200" width="190" height="96" rx="12" fill="#1E293B" stroke="#CE3262" stroke-width="2"/>
    <text x="670" y="230" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="15" fill="#E2E8F0">Max(p1, p2)</text>
    <text x="670" y="256" text-anchor="middle" font-size="13" fill="#94A3B8">T = Point struct (no &lt;)</text>
    <text x="670" y="281" text-anchor="middle" font-size="15" fill="#CE3262">✗ compile error</text>
  </g>
</svg>
